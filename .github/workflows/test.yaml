name: Tests

on: 
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x" 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest .
      - name: Run tests
        run: pytest